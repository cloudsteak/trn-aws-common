<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Hiba</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 35%, #7c3aed 70%, #ec4899 100%);
            color: white;
        }

        .card {
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
            padding: 48px 56px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        p {
            margin: 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hiba történt</h1>
        <p>Próbáld újra később.</p>
    </div>
</body>
</html>
